name: Verify desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.runner }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            bundle: app
          - runner: windows-latest
            arch: x64
            bundle: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - name: Check native host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unsupported runner architecture ' + process.arch)"
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm prepare:sidecar
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build native bundle
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - name: Verify and archive macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict 'src-tauri/target/release/bundle/macos/Nanika Box.app'
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Nanika Box.app' 'src-tauri/target/release/bundle/Nanika-Box-macOS-arm64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: nanika-box-${{ matrix.arch }}-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
