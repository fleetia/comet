name: Verify desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - '.changeset/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.changeset/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    outputs:
      ds_only: ${{ steps.scope.outputs.ds_only }}
      native_required: ${{ steps.scope.outputs.native_required }}
      bundle_required: ${{ steps.scope.outputs.bundle_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
            git show "$BASE_SHA:ds/scripts/ci-scope.mjs" > "$RUNNER_TEMP/comet-ci-scope.mjs" &&
            node "$RUNNER_TEMP/comet-ci-scope.mjs" > "$RUNNER_TEMP/comet-ci-scope-output"; then
            cat "$RUNNER_TEMP/comet-ci-scope-output" >> "$GITHUB_OUTPUT"
          else
            echo "ds_only=false" >> "$GITHUB_OUTPUT"
            echo "native_required=true" >> "$GITHUB_OUTPUT"
            echo "bundle_required=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm ds:check
      - run: pnpm exec vitest run --config vitest.ds.config.ts
      - run: pnpm --filter comet check
        if: steps.scope.outputs.ds_only != 'true'
      - run: pnpm --filter comet test
        if: steps.scope.outputs.ds_only != 'true'
      - run: pnpm --filter comet exec playwright install --with-deps chromium
        if: steps.scope.outputs.ds_only != 'true'
      - run: pnpm --filter comet test:e2e:web
        if: steps.scope.outputs.ds_only != 'true'
      - name: Upload web E2E traces
        if: failure() && steps.scope.outputs.ds_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-traces
          path: apps/comet/test-results/e2e
          if-no-files-found: ignore
      - run: pnpm test:release
        if: steps.scope.outputs.ds_only != 'true'
      - run: pnpm test:native-runtime
        if: steps.scope.outputs.ds_only != 'true'
      - run: pnpm build
        if: steps.scope.outputs.ds_only != 'true'

  desktop:
    needs: frontend
    if: needs.frontend.outputs.ds_only != 'true' && needs.frontend.outputs.native_required != 'false'
    name: ${{ matrix.runner }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            bundle: app,dmg
          - runner: windows-latest
            arch: x64
            bundle: nsis
          - runner: ubuntu-24.04
            arch: x64
            bundle: deb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - name: Check native host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unsupported runner architecture ' + process.arch)"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libxtst-dev libssl-dev libdbus-1-dev xvfb xauth
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/comet/src-tauri -> target
            apps/comet/crates/comet-nlp -> target
          shared-key: desktop-${{ matrix.runner }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@v4
        id: sidecar-cache
        with:
          path: apps/comet/src-tauri/binaries
          key: sidecar-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/comet/scripts/prepare-sidecar.mjs', 'apps/comet/scripts/prepare-nlp.mjs', 'apps/comet/scripts/native-runtime.mjs', 'apps/comet/crates/comet-nlp/Cargo.*', 'apps/comet/crates/comet-nlp/src/**', 'apps/comet/src-tauri/src/nlp/protocol.rs') }}
      - run: pnpm prepare:sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - run: pnpm prepare:nlp
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - run: cargo test --locked --manifest-path apps/comet/crates/comet-nlp/Cargo.toml
      - uses: actions/cache/save@v4
        if: steps.sidecar-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: apps/comet/src-tauri/binaries
          key: ${{ steps.sidecar-cache.outputs.cache-primary-key }}
      - run: cargo test --locked --manifest-path apps/comet/src-tauri/Cargo.toml
        if: runner.os != 'Linux'
      - name: Test Linux native host on X11
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
        run: |
          xvfb-run --auto-servernum cargo test --locked --manifest-path apps/comet/src-tauri/Cargo.toml
          xvfb-run --auto-servernum cargo test --locked --manifest-path apps/comet/src-tauri/Cargo.toml linux_input_shape_survives_hidden_realized_and_destroyed_windows -- --ignored
      - name: Build native bundle
        if: needs.frontend.outputs.bundle_required != 'false'
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - name: Verify and archive macOS app
        if: runner.os == 'macOS' && needs.frontend.outputs.bundle_required != 'false'
        run: |
          codesign --verify --deep --strict 'apps/comet/src-tauri/target/release/bundle/macos/comet.app'
          for installer in apps/comet/src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$installer"
          done
          ditto -c -k --sequesterRsrc --keepParent 'apps/comet/src-tauri/target/release/bundle/macos/comet.app' 'apps/comet/src-tauri/target/release/bundle/comet-macOS-arm64.zip'
      - name: Verify experimental Linux package
        if: runner.os == 'Linux' && needs.frontend.outputs.bundle_required != 'false'
        run: python3 scripts/verify_linux_bundle.py apps/comet/src-tauri/target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        if: needs.frontend.outputs.bundle_required != 'false'
        with:
          name: comet-${{ matrix.arch }}-${{ runner.os }}
          path: |
            apps/comet/src-tauri/target/release/bundle/*.zip
            apps/comet/src-tauri/target/release/bundle/dmg/*.dmg
            apps/comet/src-tauri/target/release/bundle/nsis/*.exe
            apps/comet/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
