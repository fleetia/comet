name: Verify desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '.changeset/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '.changeset/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm test:native-runtime
      - run: pnpm build
        if: github.event_name == 'pull_request'

  desktop:
    needs: frontend
    name: ${{ matrix.runner }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            bundle: app,dmg
          - runner: windows-latest
            arch: x64
            bundle: nsis
          - runner: ubuntu-24.04
            arch: x64
            bundle: deb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - name: Check native host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unsupported runner architecture ' + process.arch)"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libxtst-dev libssl-dev libdbus-1-dev xvfb xauth
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/comet-nlp -> target
          shared-key: desktop-${{ matrix.runner }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@v4
        id: sidecar-cache
        with:
          path: src-tauri/binaries
          key: sidecar-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-sidecar.mjs', 'scripts/prepare-nlp.mjs', 'scripts/native-runtime.mjs', 'crates/comet-nlp/Cargo.*', 'crates/comet-nlp/src/**', 'src-tauri/src/nlp/protocol.rs') }}
      - run: pnpm prepare:sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - run: pnpm prepare:nlp
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - run: cargo test --locked --manifest-path crates/comet-nlp/Cargo.toml
      - uses: actions/cache/save@v4
        if: steps.sidecar-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: src-tauri/binaries
          key: ${{ steps.sidecar-cache.outputs.cache-primary-key }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        if: runner.os != 'Linux'
      - name: Test Linux native host on X11
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
        run: |
          xvfb-run --auto-servernum cargo test --locked --manifest-path src-tauri/Cargo.toml
          xvfb-run --auto-servernum cargo test --locked --manifest-path src-tauri/Cargo.toml linux_input_shape_survives_hidden_realized_and_destroyed_windows -- --ignored
      - name: Build native bundle
        if: runner.os == 'Linux' || github.event_name != 'pull_request'
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - name: Verify and archive macOS app
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          codesign --verify --deep --strict 'src-tauri/target/release/bundle/macos/comet.app'
          for installer in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$installer"
          done
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/comet.app' 'src-tauri/target/release/bundle/comet-macOS-arm64.zip'
      - name: Verify experimental Linux package
        if: runner.os == 'Linux'
        run: python3 scripts/verify_linux_bundle.py src-tauri/target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' || github.event_name != 'pull_request'
        with:
          name: comet-${{ matrix.arch }}-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
