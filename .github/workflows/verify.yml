name: Verify desktop

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '.changeset/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '.changeset/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        if: github.event_name == 'pull_request'

  desktop:
    needs: frontend
    name: ${{ matrix.runner }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            bundle: app,dmg
          - runner: windows-latest
            arch: x64
            bundle: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - name: Check native host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unsupported runner architecture ' + process.arch)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: desktop-${{ matrix.runner }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@v4
        id: sidecar-cache
        with:
          path: src-tauri/binaries
          key: sidecar-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-sidecar.mjs') }}
      - run: pnpm prepare:sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.sidecar-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: src-tauri/binaries
          key: ${{ steps.sidecar-cache.outputs.cache-primary-key }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build native bundle
        if: github.event_name != 'pull_request'
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - name: Verify and archive macOS app
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          codesign --verify --deep --strict 'src-tauri/target/release/bundle/macos/Nanika Box.app'
          for installer in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$installer"
          done
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Nanika Box.app' 'src-tauri/target/release/bundle/Nanika-Box-macOS-arm64.zip'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: nanika-box-${{ matrix.arch }}-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
