name: Release desktop

on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable version tag to build
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate version and signing configuration
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 scripts/release.py check
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match package version'
          assert json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'] == version
          assert tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version'] == version
          assert os.environ['UPDATER_PUBLIC_KEY'].strip(), 'Set TAURI_UPDATER_PUBLIC_KEY repository variable'
          assert os.environ['UPDATER_PRIVATE_KEY'].strip(), 'Set TAURI_SIGNING_PRIVATE_KEY repository secret'
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@fleetia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm test:native-runtime
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py notes > changeset-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft,databaseId > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Published releases cannot be overwritten"'
            RELEASE_ID=$(python3 -c 'import json; print(json.load(open("release.json"))["databaseId"])')
          else
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null
            RELEASE_ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" -f name="Comet $RELEASE_TAG" \
              -F draft=true -F body=@changeset-notes.md --jq .id)
          fi
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            bundle: app,dmg
          - runner: windows-latest
            arch: x64
            bundle: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@fleetia"
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/comet-nlp -> target
          shared-key: desktop-${{ matrix.runner }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check native host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unsupported architecture ' + process.arch)"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@v4
        id: sidecar-cache
        with:
          path: src-tauri/binaries
          key: sidecar-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-sidecar.mjs', 'scripts/prepare-nlp.mjs', 'scripts/native-runtime.mjs', 'crates/comet-nlp/Cargo.*', 'crates/comet-nlp/src/**', 'src-tauri/src/nlp/protocol.rs') }}
      - run: pnpm prepare:sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - run: pnpm prepare:nlp
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - run: cargo test --locked --manifest-path crates/comet-nlp/Cargo.toml
      - uses: actions/cache/save@v4
        if: steps.sidecar-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: src-tauri/binaries
          key: ${{ steps.sidecar-cache.outputs.cache-primary-key }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Configure signed updater artifacts
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node -e "require('fs').writeFileSync('.release-tauri.json', JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.UPDATER_PUBLIC_KEY}}}))"
      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundle }} --config .release-tauri.json
      - name: Verify macOS bundles
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict 'src-tauri/target/release/bundle/macos/comet.app'
          for installer in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$installer"
          done

  linux:
    name: Experimental Linux x64 CPU / Ubuntu 24.04
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - name: Check native host architecture
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') throw new Error('Expected Linux x64 host')"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libxtst-dev libssl-dev libdbus-1-dev xvfb xauth
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/comet-nlp -> target
          shared-key: desktop-ubuntu-24.04-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@v4
        id: sidecar-cache
        with:
          path: src-tauri/binaries
          key: sidecar-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-sidecar.mjs', 'scripts/prepare-nlp.mjs', 'scripts/native-runtime.mjs', 'crates/comet-nlp/Cargo.*', 'crates/comet-nlp/src/**', 'src-tauri/src/nlp/protocol.rs') }}
      - run: pnpm prepare:sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - run: pnpm prepare:nlp
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
      - run: cargo test --locked --manifest-path crates/comet-nlp/Cargo.toml
      - name: Test Linux native host on X11
        env:
          GDK_BACKEND: x11
        run: |
          xvfb-run --auto-servernum cargo test --locked --manifest-path src-tauri/Cargo.toml
          xvfb-run --auto-servernum cargo test --locked --manifest-path src-tauri/Cargo.toml linux_input_shape_survives_hidden_realized_and_destroyed_windows -- --ignored
      # DEB is a manual-install experiment, not a Tauri updater payload.
      # Keep signing credentials and latest.json generation in the supported updater jobs.
      - name: Build experimental Linux package
        run: pnpm tauri build --bundles deb
      - name: Verify experimental Linux package
        run: python3 scripts/verify_linux_bundle.py src-tauri/target/release/bundle/deb/*.deb
      - name: Upload Linux package to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/deb/*.deb --clobber

  publish:
    needs: [prepare, build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Validate all installers and signed update targets before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir release
          gh release view "$RELEASE_TAG" --json assets,body,tagName,isDraft,url > release.json
          python3 scripts/finalize_release.py
          gh release upload "$RELEASE_TAG" release/latest.json --clobber
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --latest
          printf '[GitHub Release](https://github.com/%s/releases/tag/%s)\n\n' "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
