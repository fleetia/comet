name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate version and signing configuration
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match package version'
          assert json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'] == version
          assert tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version'] == version
          assert os.environ['UPDATER_PUBLIC_KEY'].strip(), 'Set TAURI_UPDATER_PUBLIC_KEY repository variable'
          assert os.environ['UPDATER_PRIVATE_KEY'].strip(), 'Set TAURI_SIGNING_PRIVATE_KEY repository secret'
          PY
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Published releases cannot be overwritten"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Comet $RELEASE_TAG" --generate-notes
          fi
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            bundle: app,dmg
          - runner: windows-latest
            arch: x64
            bundle: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@fleetia'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unsupported architecture ' + process.arch)"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm check
      - run: pnpm test
      - run: pnpm prepare:sidecar
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Configure signed updater artifacts
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node -e "require('fs').writeFileSync('.release-tauri.json', JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.UPDATER_PUBLIC_KEY}}}))"
      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundle }} --config .release-tauri.json
      - name: Verify macOS bundles
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict 'src-tauri/target/release/bundle/macos/Nanika Box.app'
          for installer in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$installer"
          done

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate both update targets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir release
          gh release view "$RELEASE_TAG" --json assets,body > release.json
          python3 - <<'PY'
          import json, os
          from urllib.parse import unquote, urlparse
          from pathlib import Path
          manifest = json.loads(Path('release/latest.json').read_text())
          assert manifest['version'].lstrip('v') == os.environ['RELEASE_TAG'].lstrip('v')
          release = json.loads(Path('release.json').read_text())
          assets = {asset['name']: asset for asset in release['assets']}
          downloads = []
          for platform, extension in [('macOS 14+ · Apple Silicon', '.dmg'), ('Windows · x64', '.exe')]:
              installers = [asset for name, asset in assets.items() if name.endswith(extension)]
              assert len(installers) == 1 and installers[0]['size'] > 0, f'Missing or ambiguous installer: {extension}'
              downloads.append(f"| {platform} | [{extension[1:].upper()} 다운로드]({installers[0]['url']}) |")
          for candidates in [('darwin-aarch64-app', 'darwin-aarch64'), ('windows-x86_64-nsis', 'windows-x86_64')]:
              target = next((manifest['platforms'][key] for key in candidates if key in manifest['platforms']), None)
              assert target and target['signature'].strip(), f'Missing signed target: {candidates}'
              url = urlparse(target['url'])
              prefix = f"/{os.environ['GH_REPO']}/releases/download/{os.environ['RELEASE_TAG']}/"
              assert url.scheme == 'https' and url.netloc == 'github.com' and unquote(url.path).startswith(prefix), 'Asset must point to this release'
              name = unquote(url.path).rsplit('/', 1)[-1]
              assert name in assets and assets[name]['size'] > 0, f'Missing asset: {name}'
              assert name + '.sig' in assets, f'Missing signature asset: {name}'
          notes = '\n'.join([
              '## 다운로드', '', '| 운영체제 | 설치 파일 |', '| --- | --- |', *downloads, '',
              'macOS는 DMG를 열고 Nanika Box를 Applications 폴더로 옮겨 실행하세요. Windows는 EXE 설치 파일을 실행하세요.', '',
              '앱 updater 서명은 적용됩니다. macOS notarization과 Windows Authenticode 서명은 아직 제공하지 않습니다.', '',
              (release.get('body') or '').strip(), '',
          ])
          Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --latest
          printf '[GitHub Release](https://github.com/%s/releases/tag/%s)\n\n' "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
