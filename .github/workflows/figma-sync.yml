name: Figma change report

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figma-design-system
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compare Figma components with the accepted snapshot
        run: node ds/scripts/figma-rest.mjs prepare
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
      - name: Create or update the change report pull request
        run: node ds/scripts/figma-proposal.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          FIGMA_BASE_SHA: ${{ steps.base.outputs.sha }}
