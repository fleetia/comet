[package]
name = "comet-nlp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "=0.8.9"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
